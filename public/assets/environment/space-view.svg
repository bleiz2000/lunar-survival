<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800">
  <defs>
    <linearGradient id="void" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#05070E"/>
      <stop offset="55%" stop-color="#0A1020"/>
      <stop offset="100%" stop-color="#111A2C"/>
    </linearGradient>
    <radialGradient id="haze" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#8FB6D8" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#6E93B8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#6E93B8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8D879C"/>
      <stop offset="45%" stop-color="#6E6879"/>
      <stop offset="100%" stop-color="#3E3A47"/>
    </linearGradient>
    <radialGradient id="earth" cx="34%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8FD0F7"/>
      <stop offset="55%" stop-color="#3E79B4"/>
      <stop offset="100%" stop-color="#1B3A5E"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="800" fill="url(#void)"/>

  <!-- faint nebula wash -->
  <ellipse cx="250" cy="180" rx="300" ry="180" fill="#2B4A7A" opacity="0.14"/>
  <ellipse cx="780" cy="120" rx="240" ry="140" fill="#5A3F7A" opacity="0.10"/>

  <!-- stars -->
  <g fill="#E6EEFF">
    <circle cx="70" cy="90" r="2.4" opacity="0.9"/><circle cx="150" cy="46" r="1.4" opacity="0.7"/>
    <circle cx="228" cy="132" r="1.8" opacity="0.8"/><circle cx="318" cy="62" r="1.2" opacity="0.6"/>
    <circle cx="404" cy="118" r="2" opacity="0.85"/><circle cx="492" cy="48" r="1.3" opacity="0.65"/>
    <circle cx="560" cy="140" r="2.2" opacity="0.9"/><circle cx="648" cy="76" r="1.5" opacity="0.7"/>
    <circle cx="726" cy="160" r="1.2" opacity="0.55"/><circle cx="812" cy="66" r="2" opacity="0.85"/>
    <circle cx="902" cy="126" r="1.4" opacity="0.7"/><circle cx="960" cy="36" r="1.8" opacity="0.75"/>
    <circle cx="108" cy="212" r="1.5" opacity="0.6"/><circle cx="196" cy="268" r="2.1" opacity="0.8"/>
    <circle cx="286" cy="206" r="1.2" opacity="0.5"/><circle cx="372" cy="256" r="1.7" opacity="0.7"/>
    <circle cx="470" cy="214" r="1.3" opacity="0.6"/><circle cx="556" cy="284" r="2" opacity="0.8"/>
    <circle cx="690" cy="234" r="1.4" opacity="0.6"/><circle cx="784" cy="292" r="1.7" opacity="0.7"/>
    <circle cx="880" cy="216" r="1.2" opacity="0.5"/><circle cx="948" cy="286" r="2" opacity="0.75"/>
    <circle cx="54" cy="336" r="1.6" opacity="0.6"/><circle cx="148" cy="392" r="1.2" opacity="0.5"/>
    <circle cx="252" cy="346" r="1.9" opacity="0.7"/><circle cx="356" cy="398" r="1.3" opacity="0.55"/>
    <circle cx="472" cy="356" r="1.6" opacity="0.65"/><circle cx="606" cy="392" r="1.2" opacity="0.5"/>
    <circle cx="720" cy="348" r="1.8" opacity="0.7"/><circle cx="846" cy="398" r="1.3" opacity="0.55"/>
    <circle cx="936" cy="344" r="1.6" opacity="0.6"/>
  </g>
  <g fill="#BFD4F0" opacity="0.8">
    <circle cx="120" cy="150" r="1" /><circle cx="340" cy="180" r="1"/>
    <circle cx="520" cy="96" r="1" /><circle cx="700" cy="200" r="1"/>
    <circle cx="860" cy="110" r="1" /><circle cx="410" cy="330" r="1"/>
    <circle cx="620" cy="320" r="1" />
  </g>

  <!-- Earth, hanging above the horizon -->
  <g>
    <circle cx="268" cy="196" r="52" fill="#8FD0F7" opacity="0.12"/>
    <circle cx="268" cy="196" r="44" fill="url(#earth)"/>
    <path d="M240 176 Q258 166 278 174 Q292 190 286 208 Q268 214 252 204 Q238 194 240 176 Z" fill="#6FA38A" opacity="0.75"/>
    <path d="M282 202 Q296 210 292 224 Q278 228 272 216 Z" fill="#5F8F7B" opacity="0.6"/>
    <ellipse cx="252" cy="180" rx="16" ry="9" fill="#FFFFFF" opacity="0.28"/>
    <circle cx="268" cy="196" r="44" fill="none" stroke="#9FD8F7" stroke-width="1.6" opacity="0.5"/>
  </g>

  <!-- lunar limb -->
  <path d="M0 620 Q250 520 500 548 Q760 578 1000 508 L1000 800 L0 800 Z" fill="url(#haze)"/>
  <path d="M0 654 Q250 566 500 592 Q760 620 1000 552 L1000 800 L0 800 Z" fill="url(#ground)"/>
  <path d="M0 654 Q250 566 500 592 Q760 620 1000 552" fill="none" stroke="#C7C0D4" stroke-width="3" opacity="0.55"/>

  <!-- craters on the near surface -->
  <g fill="#5B5667" opacity="0.55">
    <ellipse cx="180" cy="700" rx="46" ry="12"/>
    <ellipse cx="430" cy="742" rx="62" ry="15"/>
    <ellipse cx="700" cy="686" rx="38" ry="10"/>
    <ellipse cx="880" cy="748" rx="54" ry="13"/>
  </g>
  <g fill="#ABA4BB" opacity="0.35">
    <ellipse cx="180" cy="694" rx="46" ry="10"/>
    <ellipse cx="430" cy="735" rx="62" ry="13"/>
    <ellipse cx="700" cy="680" rx="38" ry="9"/>
    <ellipse cx="880" cy="741" rx="54" ry="11"/>
  </g>
</svg>
