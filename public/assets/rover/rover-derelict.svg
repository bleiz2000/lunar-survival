<svg xmlns="http://www.w3.org/2000/svg" width="156" height="108" viewBox="0 0 156 108">
  <defs>
    <linearGradient id="rvBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66707F"/>
      <stop offset="55%" stop-color="#4C5665"/>
      <stop offset="100%" stop-color="#343D4B"/>
    </linearGradient>
    <linearGradient id="rvPanel" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#2B3A4C"/>
      <stop offset="100%" stop-color="#17202C"/>
    </linearGradient>
  </defs>

  <ellipse cx="78" cy="97" rx="58" ry="8" fill="#0B0E14" opacity="0.2"/>

  <g transform="rotate(-3.5 78 70)">
    <!-- far-side wheels -->
    <g fill="#2A313C" stroke="#161C24" stroke-width="2">
      <circle cx="50" cy="80" r="9"/>
      <circle cx="86" cy="80" r="9"/>
      <circle cx="122" cy="80" r="9"/>
    </g>

    <!-- chassis -->
    <path d="M24 54 Q24 48 32 48 L128 48 Q136 48 136 55 L136 72 Q136 78 128 78 L32 78 Q24 78 24 71 Z"
          fill="url(#rvBody)" stroke="#2A323E" stroke-width="2.5"/>
    <path d="M32 72 L128 72" stroke="#7A8494" stroke-width="1.4" opacity="0.55"/>

    <!-- solar deck, dim and dust-caked -->
    <g transform="rotate(-4 78 47)">
      <rect x="34" y="30" width="86" height="28" rx="4" fill="url(#rvPanel)" stroke="#4C586B" stroke-width="2.5"/>
      <g stroke="#33465F" stroke-width="1.3" opacity="0.9">
        <path d="M34 39 H120"/><path d="M34 48 H120"/>
        <path d="M56 30 V58"/><path d="M78 30 V58"/><path d="M100 30 V58"/>
      </g>
      <path d="M62 31 L74 45 L66 57" fill="none" stroke="#9AAEC2" stroke-width="1.4" opacity="0.45"/>
      <path d="M92 30 L88 42" fill="none" stroke="#9AAEC2" stroke-width="1.2" opacity="0.35"/>
      <g fill="#B4A184" opacity="0.2">
        <path d="M36 56 L52 56 L46 58 L36 58 Z"/>
        <path d="M100 31 L120 31 L120 36 L112 34 Z"/>
        <circle cx="70" cy="52" r="3"/>
      </g>
    </g>

    <!-- rear equipment bay -->
    <rect x="108" y="42" width="23" height="18" rx="3" fill="#59616E" stroke="#373F4C" stroke-width="2"/>
    <g fill="#2C333E">
      <rect x="112" y="46" width="15" height="3" rx="1.5"/>
      <rect x="112" y="52" width="10" height="3" rx="1.5"/>
    </g>

    <!-- beacon mast, amber and dim -->
    <path d="M119 42 L119 30" stroke="#7C8594" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="119" cy="27" r="4.5" fill="#C98A44" opacity="0.75"/>

    <!-- bent survey antenna -->
    <path d="M108 45 L96 56" stroke="#8E97A6" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M96 56 L88 54" stroke="#6D7684" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="87" cy="54" r="2.4" fill="#9AA3B2" opacity="0.8"/>

    <!-- near-side wheels -->
    <g>
      <circle cx="42" cy="86" r="12" fill="#242B35" stroke="#121820" stroke-width="2.5"/>
      <circle cx="42" cy="86" r="5" fill="#5A6373"/>
      <circle cx="42" cy="86" r="2" fill="#98A0AE" opacity="0.8"/>
      <circle cx="80" cy="86" r="12" fill="#242B35" stroke="#121820" stroke-width="2.5"/>
      <circle cx="80" cy="86" r="5" fill="#5A6373"/>
      <circle cx="80" cy="86" r="2" fill="#98A0AE" opacity="0.8"/>
      <circle cx="118" cy="88" r="12" fill="#20262F" stroke="#121820" stroke-width="2.5"/>
      <circle cx="118" cy="88" r="5" fill="#4E5664"/>
      <circle cx="118" cy="88" r="2" fill="#8A929F" opacity="0.7"/>
    </g>

    <!-- dead headlamp -->
    <circle cx="138" cy="64" r="3.4" fill="#3A4352" stroke="#232A34" stroke-width="1.2"/>
  </g>

  <!-- drifted regolith against the wheels -->
  <g fill="#B7AB93" opacity="0.22">
    <path d="M20 96 Q40 91 58 95 Q40 99 20 99 Z"/>
    <path d="M100 97 Q121 92 138 96 Q120 100 100 100 Z"/>
  </g>
  <g fill="#C7BCA6" opacity="0.16">
    <circle cx="34" cy="95" r="1.4"/>
    <circle cx="126" cy="94" r="1.2"/>
    <circle cx="88" cy="96" r="1"/>
  </g>
</svg>
