<svg xmlns="http://www.w3.org/2000/svg" width="156" height="108" viewBox="0 0 156 108">
  <defs>
    <linearGradient id="rvBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B94A3"/>
      <stop offset="55%" stop-color="#6B7585"/>
      <stop offset="100%" stop-color="#4B5565"/>
    </linearGradient>
    <linearGradient id="rvPanel" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#3D6699"/>
      <stop offset="100%" stop-color="#274A78"/>
    </linearGradient>
    <radialGradient id="rvBeacon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#B7FFE6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7FE3C0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rvLamp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F6D488" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#F6D488" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <ellipse cx="78" cy="97" rx="58" ry="8" fill="#0B0E14" opacity="0.2"/>

  <!-- far-side wheels -->
  <g fill="#343C48" stroke="#1B222C" stroke-width="2">
    <circle cx="50" cy="80" r="9"/>
    <circle cx="86" cy="80" r="9"/>
    <circle cx="122" cy="80" r="9"/>
  </g>

  <!-- chassis -->
  <path d="M24 54 Q24 48 32 48 L128 48 Q136 48 136 55 L136 72 Q136 78 128 78 L32 78 Q24 78 24 71 Z"
        fill="url(#rvBody)" stroke="#323B49" stroke-width="2.5"/>
  <path d="M32 72 L128 72" stroke="#AEB8C8" stroke-width="1.4" opacity="0.6"/>
  <rect x="34" y="73" width="88" height="2.4" rx="1.2" fill="#7FE3C0" opacity="0.85"/>

  <!-- solar deck, live -->
  <rect x="34" y="30" width="86" height="28" rx="4" fill="url(#rvPanel)" stroke="#C9CED8" stroke-width="2.5"/>
  <g stroke="#6E9BCE" stroke-width="1.3" opacity="0.95">
    <path d="M34 39 H120"/><path d="M34 48 H120"/>
    <path d="M56 30 V58"/><path d="M78 30 V58"/><path d="M100 30 V58"/>
  </g>
  <path d="M38 32 L60 32 L44 56 L36 56 Z" fill="#A8C8E8" opacity="0.24"/>
  <g fill="#DCEBFA" opacity="0.8">
    <circle cx="46" cy="34" r="1.2"/>
    <circle cx="96" cy="36" r="1.2"/>
  </g>

  <!-- rear equipment bay -->
  <rect x="108" y="42" width="23" height="18" rx="3" fill="#76808F" stroke="#3E4754" stroke-width="2"/>
  <g fill="#2F3946">
    <rect x="112" y="46" width="15" height="3" rx="1.5"/>
    <rect x="112" y="52" width="10" height="3" rx="1.5"/>
  </g>
  <circle cx="124" cy="57" r="1.6" fill="#7FE3C0"/>

  <!-- beacon mast, teal and steady -->
  <path d="M119 42 L119 28" stroke="#9AA3B2" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="119" cy="25" r="10" fill="url(#rvBeacon)"/>
  <circle cx="119" cy="25" r="4.5" fill="#7FE3C0" stroke="#B7FFE6" stroke-width="1.4"/>
  <circle cx="119" cy="25" r="1.6" fill="#F2FFFB"/>

  <!-- upright survey antenna -->
  <path d="M108 45 L108 24" stroke="#A7B0BF" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M102 27 L114 27" stroke="#A7B0BF" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="108" cy="21" r="2.6" fill="#DCEBFA"/>

  <!-- near-side wheels -->
  <g>
    <circle cx="42" cy="86" r="12" fill="#2C333E" stroke="#141A22" stroke-width="2.5"/>
    <circle cx="42" cy="86" r="5" fill="#77808F"/>
    <circle cx="42" cy="86" r="2" fill="#C6CEDB" opacity="0.85"/>
    <circle cx="80" cy="86" r="12" fill="#2C333E" stroke="#141A22" stroke-width="2.5"/>
    <circle cx="80" cy="86" r="5" fill="#77808F"/>
    <circle cx="80" cy="86" r="2" fill="#C6CEDB" opacity="0.85"/>
    <circle cx="118" cy="86" r="12" fill="#2C333E" stroke="#141A22" stroke-width="2.5"/>
    <circle cx="118" cy="86" r="5" fill="#77808F"/>
    <circle cx="118" cy="86" r="2" fill="#C6CEDB" opacity="0.85"/>
  </g>

  <!-- working headlamp with spill -->
  <path d="M138 60 L156 48 L156 78 L138 68 Z" fill="url(#rvLamp)"/>
  <circle cx="138" cy="64" r="3.6" fill="#F6D488" stroke="#BF9C55" stroke-width="1.2"/>
  <circle cx="138" cy="64" r="1.5" fill="#FFF6DC"/>
</svg>
