<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <defs>
    <!-- glass tint: bright ice-blue core with soft halo, transparent outside -->
    <linearGradient id="crackCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="55%"  stop-color="#DCE6F2"/>
      <stop offset="100%" stop-color="#AEBFDB"/>
    </linearGradient>
  </defs>

  <!-- spiderweb cracks: two continuous fracture chains (fill = light) -->
  <g fill="none" stroke="#0F1B2E" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" opacity="0.55">
    <path d="M110 96 L88 108 L94 122 L74 132"/>
    <path d="M110 96 L128 84 L150 88 L162 76 L184 80"/>
    <path d="M110 96 L118 118 L110 134 L120 150"/>
    <path d="M74 132 L62 126 L46 130"/>
    <path d="M162 76 L168 60 L184 54"/>
    <path d="M110 134 L96 142"/>
    <path d="M128 84 L134 68 L126 56 L134 42"/>
    <path d="M188 112 L174 106"/>
    <path d="M36 92 L50 96 L56 110"/>
    <path d="M120 150 L138 158 L134 174 L146 184"/>
  </g>

  <g fill="none" stroke="url(#crackCore)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M110 96 L88 108 L94 122 L74 132"/>
    <path d="M110 96 L128 84 L150 88 L162 76 L184 80"/>
    <path d="M110 96 L118 118 L110 134 L120 150"/>
    <path d="M74 132 L62 126 L46 130"/>
    <path d="M162 76 L168 60 L184 54"/>
    <path d="M110 134 L96 142"/>
    <path d="M128 84 L134 68 L126 56 L134 42"/>
    <path d="M188 112 L174 106"/>
    <path d="M36 92 L50 96 L56 110"/>
    <path d="M120 150 L138 158 L134 174 L146 184"/>
  </g>

  <!-- hairline fractures -->
  <g fill="none" stroke="url(#crackCore)" stroke-width="1.4" opacity="0.8" stroke-linecap="round">
    <path d="M96 76 L110 96"/>
    <path d="M150 60 L144 72"/>
    <path d="M64 104 L74 132"/>
    <path d="M154 118 L162 132"/>
    <path d="M100 156 L96 168"/>
    <path d="M170 92 L188 112"/>
    <path d="M58 68 L70 78"/>
    <path d="M180 150 L170 138"/>
    <path d="M62 148 L74 166"/>
  </g>
</svg>
