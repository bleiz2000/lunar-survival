<svg xmlns="http://www.w3.org/2000/svg" width="84" height="72" viewBox="0 0 84 72">
  <defs>
    <linearGradient id="cnPanel" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#33404F"/>
      <stop offset="55%" stop-color="#243040"/>
      <stop offset="100%" stop-color="#1A2430"/>
    </linearGradient>
    <linearGradient id="cnScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E6E8E"/>
      <stop offset="100%" stop-color="#1D3A52"/>
    </linearGradient>
  </defs>

  <ellipse cx="42" cy="64" rx="34" ry="5" fill="#0B0E14" opacity="0.22"/>

  <!-- base frame -->
  <rect x="4" y="8" width="76" height="52" rx="9" fill="url(#cnPanel)"
        stroke="#4A5A70" stroke-width="3.5"/>
  <!-- corner screws -->
  <g fill="#5E6F86">
    <circle cx="12" cy="15" r="2.6"/><circle cx="72" cy="15" r="2.6"/>
    <circle cx="12" cy="53" r="2.6"/><circle cx="72" cy="53" r="2.6"/>
  </g>

  <!-- screen -->
  <rect x="14" y="16" width="56" height="24" rx="4" fill="#101823" stroke="#4A5A70" stroke-width="2.5"/>
  <rect x="18" y="20" width="48" height="16" rx="2.5" fill="url(#cnScreen)" opacity="0.9"/>
  <g stroke="#9ED2EE" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <path d="M22 32 L28 32 L31 25 L34 32 L40 32"/>
  </g>
  <g stroke="#59B7D0" stroke-width="1.4" opacity="0.55">
    <path d="M52 22 L64 22"/><path d="M52 26 L60 26"/><path d="M52 30 L56 30"/>
  </g>

  <!-- telemetry row + battery indicator row -->
  <g fill="#E4853C" opacity="0.95">
    <rect x="18" y="44" width="10" height="8" rx="2"/>
  </g>
  <g fill="#31524F" opacity="0.95">
    <rect x="31" y="44" width="10" height="8" rx="2"/>
  </g>
  <g fill="#3A4A5E">
    <rect x="44" y="44" width="10" height="8" rx="2"/>
  </g>
  <!-- warning chevron strip -->
  <g fill="#E4853C" opacity="0.9">
    <rect x="60" y="45" width="5" height="3" rx="1"/>
    <rect x="66" y="49" width="4" height="3" rx="1"/>
  </g>
  <g fill="#7FE3A0" opacity="0.9">
    <rect x="60" y="50" width="5" height="3" rx="1"/>
  </g>

  <!-- vent grid -->
  <g fill="#0F1620">
    <rect x="30" y="4" width="24" height="4" rx="2" opacity="0.9"/>
  </g>
</svg>
