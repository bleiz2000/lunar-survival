<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#FCFAF4"/>
      <stop offset="52%" stop-color="#F0EADF"/>
      <stop offset="100%" stop-color="#DCD3C1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#42596F"/>
      <stop offset="100%" stop-color="#1F2C3A"/>
    </linearGradient>
    <linearGradient id="skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D6CDBB"/>
      <stop offset="100%" stop-color="#BFB4A0"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="100" cy="176" rx="70" ry="13" fill="#0B0E14" opacity="0.20"/>

  <!-- landing legs -->
  <g stroke="#A9AEBA" stroke-width="8" stroke-linecap="round">
    <path d="M60 118 L36 158"/>
    <path d="M140 118 L164 158"/>
  </g>
  <g stroke="#B9BFC9" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <path d="M76 134 L64 166"/>
    <path d="M124 134 L136 166"/>
  </g>
  <g fill="#B7BDC8" stroke="#8B929E" stroke-width="2">
    <rect x="22" y="156" width="30" height="11" rx="5.5"/>
    <rect x="148" y="156" width="30" height="11" rx="5.5"/>
    <rect x="52" y="166" width="24" height="9" rx="4.5"/>
    <rect x="124" y="166" width="24" height="9" rx="4.5"/>
  </g>

  <!-- descent stage skirt -->
  <path d="M46 120 L154 120 L146 146 L54 146 Z" fill="url(#skirt)" stroke="#B4A995" stroke-width="3"/>
  <g stroke="#B4A995" stroke-width="2" opacity="0.8">
    <path d="M66 122 L64 144"/><path d="M88 122 L88 144"/>
    <path d="M112 122 L112 144"/><path d="M134 122 L136 144"/>
  </g>
  <g fill="#9AA1AD">
    <circle cx="58" cy="133" r="4"/><circle cx="142" cy="133" r="4"/>
  </g>

  <!-- ascent module hull -->
  <path d="M100 20 L147 40 L170 88 L156 122 L44 122 L30 88 L53 40 Z"
        fill="url(#hull)" stroke="#D3CAB8" stroke-width="4" stroke-linejoin="round"/>

  <!-- upper dome cap -->
  <path d="M53 40 L100 20 L147 40 L131 55 L69 55 Z" fill="#FDFBF6" stroke="#DAD2C2" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- cabin window -->
  <circle cx="100" cy="72" r="21" fill="#C3C9D2" stroke="#9FA6B2" stroke-width="2"/>
  <circle cx="100" cy="72" r="15" fill="url(#glass)" stroke="#7F8896" stroke-width="2.5"/>
  <path d="M92 66 A12 12 0 0 1 106 62" fill="none" stroke="#93C6E6" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <circle cx="100" cy="72" r="15" fill="none" stroke="#5D7286" stroke-width="1" opacity="0.6"/>

  <!-- hull panel seams -->
  <path d="M40 100 L160 100" stroke="#E4DCCC" stroke-width="2.5"/>
  <path d="M47 108 L153 108" stroke="#E9E2D3" stroke-width="1.5" opacity="0.9"/>

  <!-- side equipment pods -->
  <g fill="#D9D2C4" stroke="#B7AC98" stroke-width="2.5">
    <rect x="46" y="84" width="18" height="13" rx="3"/>
    <rect x="136" y="84" width="18" height="13" rx="3"/>
  </g>
  <g fill="#E4853C">
    <rect x="51" y="89" width="8" height="3" rx="1.5"/>
    <rect x="141" y="89" width="8" height="3" rx="1.5"/>
  </g>

  <!-- hatch + steps -->
  <rect x="86" y="112" width="28" height="12" rx="3" fill="#C9C0AE" stroke="#AB9F8B" stroke-width="2.5"/>
  <rect x="95" y="116" width="10" height="3" rx="1.5" fill="#8E8371"/>
  <g stroke="#A9AEBA" stroke-width="3" stroke-linecap="round">
    <path d="M90 124 L90 152"/>
    <path d="M100 124 L100 152"/>
    <path d="M110 124 L110 152"/>
  </g>
  <g stroke="#A9AEBA" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <path d="M90 134 L110 134"/><path d="M90 143 L110 143"/>
  </g>

  <!-- antenna mast + beacon -->
  <line x1="138" y1="46" x2="152" y2="22" stroke="#A9AEBA" stroke-width="3" stroke-linecap="round"/>
  <circle cx="152" cy="21" r="3.8" fill="#E25757" stroke="#B94343" stroke-width="1.5"/>
  <line x1="64" y1="46" x2="56" y2="30" stroke="#B9BFC9" stroke-width="2.5" stroke-linecap="round"/>

  <!-- small dish on the left shoulder -->
  <g transform="rotate(-24 58 34)">
    <ellipse cx="58" cy="34" rx="11" ry="5.5" fill="#E7E2D6" stroke="#B9B0A0" stroke-width="2"/>
    <circle cx="58" cy="34" r="2" fill="#9AA1AD"/>
  </g>
</svg>
