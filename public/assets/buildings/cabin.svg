<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#141d2c"/>
      <stop offset="45%" stop-color="#111928"/>
      <stop offset="100%" stop-color="#0a1019"/>
    </linearGradient>
    <linearGradient id="wallLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2537"/>
      <stop offset="100%" stop-color="#131d2e"/>
    </linearGradient>
    <linearGradient id="seat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3a53"/>
      <stop offset="100%" stop-color="#1d2a41"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18202e"/>
      <stop offset="100%" stop-color="#0e151f"/>
    </linearGradient>
    <linearGradient id="shadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04060c" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#04060c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shadeBottom" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#04060c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#04060c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#04060c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#04060c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shadeRight" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#04060c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#04060c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ceilingLamp" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#9fc2e4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#9fc2e4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ============ hull walls — the viewport is a real elliptical hole ============ -->
  <path fill="url(#wall)" fill-rule="evenodd"
        d="M0 0 H1280 V720 H0 Z
           M780 168 A150 118 0 1 0 780 404 A150 118 0 1 0 780 168 Z"/>

  <!-- seam lines and rivets, quiet and dark -->
  <g stroke="#0b131e" stroke-width="3" opacity="0.7">
    <path d="M60 120 V700"/><path d="M240 100 V700"/><path d="M420 100 V700"/>
    <path d="M520 100 V700"/><path d="M1010 100 V700"/><path d="M1160 120 V700"/>
    <path d="M0 470 H560"/><path d="M1010 470 H1280"/>
  </g>
  <g fill="#26374e">
    <circle cx="80" cy="150" r="3.4"/><circle cx="80" cy="300" r="3.4"/><circle cx="80" cy="530" r="3.4"/>
    <circle cx="262" cy="140" r="3.4"/><circle cx="262" cy="430" r="3.4"/>
    <circle cx="444" cy="130" r="3.4"/><circle cx="444" cy="444" r="3.4"/>
    <circle cx="1026" cy="140" r="3.4"/><circle cx="1026" cy="430" r="3.4"/>
    <circle cx="1198" cy="180" r="3.4"/><circle cx="1198" cy="560" r="3.4"/>
  </g>

  <!-- ceiling: deep steel, tiny dim lamps, no bright bars -->
  <rect x="0" y="0" width="1280" height="86" fill="url(#wallLight)"/>
  <rect x="0" y="82" width="1280" height="6" fill="#080d16"/>
  <g fill="#8fb0cc" opacity="0.13">
    <circle cx="200" cy="34" r="3"/><circle cx="430" cy="34" r="3"/><circle cx="660" cy="34" r="3"/>
    <circle cx="340" cy="60" r="2.4"/><circle cx="570" cy="60" r="2.4"/><circle cx="1020" cy="44" r="3"/>
  </g>
  <g stroke="#1e2c41" stroke-width="5" opacity="0.9">
    <path d="M120 18 H380"/><path d="M1120 18 H1260"/>
  </g>
  <rect x="0" y="0" width="1280" height="300" fill="url(#ceilingLamp)"/>

  <!-- right side machinery, dark silhouettes -->
  <rect x="1196" y="110" width="72" height="150" rx="8" fill="#0f1928" stroke="#1e2c41" stroke-width="3"/>
  <rect x="1208" y="128" width="46" height="10" rx="5" fill="#1a2739"/>
  <rect x="1208" y="196" width="46" height="10" rx="5" fill="#1a2739"/>
  <g stroke="#1a2739" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <path d="M1130 96 V440"/><path d="M1162 96 V440"/>
  </g>
  <g fill="#223349">
    <rect x="1120" y="200" width="52" height="16" rx="6"/>
    <rect x="1120" y="330" width="52" height="16" rx="6"/>
  </g>
  <g>
    <rect x="1070" y="196" width="30" height="66" rx="12" fill="#66241e" stroke="#4c1c17" stroke-width="3"/>
    <rect x="1080" y="186" width="10" height="14" rx="3" fill="#28303c"/>
    <rect x="1076" y="220" width="18" height="8" rx="3" fill="#a8b3c2" opacity="0.35"/>
  </g>

  <!-- ============ pilot seat ============ -->
  <g>
    <rect x="292" y="600" width="120" height="14" rx="6" fill="#151f2d" stroke="#223349" stroke-width="3"/>
    <rect x="336" y="556" width="34" height="52" rx="6" fill="#1a2839"/>
    <path d="M262 420 Q306 386 352 420 L360 540 Q352 574 320 578 L288 578 Q252 574 246 540 Z"
          fill="url(#seat)" stroke="#2e435c" stroke-width="4"/>
    <path d="M270 432 Q308 406 344 432" fill="none" stroke="#3c506d" stroke-width="3" opacity="0.8"/>
    <rect x="240" y="540" width="140" height="42" rx="12" fill="#223349" stroke="#2e435c" stroke-width="4"/>
    <rect x="252" y="548" width="116" height="10" rx="5" fill="#2c4158" opacity="0.85"/>
    <g fill="#2e435c">
      <rect x="252" y="466" width="16" height="10" rx="5"/>
      <rect x="352" y="466" width="16" height="10" rx="5"/>
    </g>
    <g stroke="#2e435c" stroke-width="6" stroke-linecap="round">
      <path d="M238 500 Q214 520 216 548"/>
      <path d="M372 500 Q396 520 394 548"/>
    </g>
  </g>

  <!-- ============ console / desk ============ -->
  <g>
    <path d="M434 470 L596 470 L612 520 L420 520 Z" fill="#1b273a" stroke="#2b3d54" stroke-width="4"/>
    <rect x="448" y="392" width="132" height="80" rx="8" fill="#0d1521" stroke="#2b3d54" stroke-width="4"/>
    <rect x="458" y="402" width="112" height="60" rx="4" fill="#0a1e30"/>
    <g stroke="#4cc7ad" stroke-width="2.6" opacity="0.5" stroke-linecap="round">
      <path d="M468 448 L492 448 L504 424 L520 448 L544 448"/>
      <path d="M468 414 H556" opacity="0.3"/>
    </g>
    <g fill="#7fd7e8" opacity="0.5">
      <circle cx="560" cy="486" r="4"/><circle cx="572" cy="486" r="4"/>
    </g>
    <g fill="#e4853c" opacity="0.6"><circle cx="584" cy="486" r="4"/></g>
    <rect x="430" y="518" width="190" height="8" rx="4" fill="#131e2c"/>
    <!-- mug, faint -->
    <g>
      <rect x="540" y="532" width="26" height="30" rx="6" fill="#8f9dae" stroke="#6b7c92" stroke-width="3"/>
      <path d="M566 540 Q578 540 578 550 Q578 558 566 558" fill="none" stroke="#6b7c92" stroke-width="4"/>
      <rect x="544" y="536" width="18" height="6" rx="3" fill="#4d3a2a"/>
    </g>
    <!-- tablet, upside down -->
    <g transform="rotate(-8 520 560)">
      <rect x="496" y="546" width="52" height="34" rx="4" fill="#182334" stroke="#28374b" stroke-width="3"/>
      <rect x="502" y="552" width="40" height="22" rx="2" fill="#1f4259" opacity="0.8"/>
    </g>
  </g>

  <!-- ============ elliptical viewport: a real porthole with a plated frame ============ -->
  <ellipse cx="780" cy="286" rx="172" ry="138" fill="#2a384e"/>
  <ellipse cx="780" cy="286" rx="172" ry="138" fill="none" stroke="#0d1622" stroke-width="8"/>
  <ellipse cx="780" cy="286" rx="160" ry="126" fill="none" stroke="#3d4f6b" stroke-width="5"/>
  <ellipse cx="780" cy="286" rx="150" ry="117" fill="none" stroke="#0b141f" stroke-width="7"/>
  <!-- frame bolts -->
  <g fill="#465a76">
    <circle cx="780" cy="158" r="4.5"/><circle cx="780" cy="414" r="4.5"/>
    <circle cx="610" cy="286" r="4.5"/><circle cx="950" cy="286" r="4.5"/>
    <circle cx="661" cy="203" r="4"/><circle cx="899" cy="203" r="4"/>
    <circle cx="661" cy="369" r="4"/><circle cx="899" cy="369" r="4"/>
  </g>
  <!-- lens mounts cut into the frame -->
  <g stroke="#33465e" stroke-width="3" opacity="0.45">
    <path d="M628 286 m-10 0 a10 10 0 0 1 20 0 a10 10 0 0 1 -20 0"/>
    <path d="M932 286 m-10 0 a10 10 0 0 1 20 0 a10 10 0 0 1 -20 0"/>
  </g>

  <!-- ============ floor ============ -->
  <rect x="0" y="612" width="1280" height="108" fill="url(#floor)"/>
  <g stroke="#1d2a3d" stroke-width="3" opacity="0.55">
    <path d="M0 640 H1280"/><path d="M0 672 H1280"/>
    <path d="M160 612 V720"/><path d="M440 612 V720"/><path d="M900 612 V720"/><path d="M1060 612 V720"/>
  </g>

  <!-- ============ ambient depth ============ -->
  <ellipse cx="780" cy="286" rx="230" ry="200" fill="#4f7ba8" opacity="0.045"/>
  <ellipse cx="330" cy="330" rx="300" ry="220" fill="#3f5d84" opacity="0.04"/>

  <!-- soft shadow belts: they replace the old "flat blueprint" bands -->
  <rect x="0" y="0" width="1280" height="190" fill="url(#shadeTop)"/>
  <rect x="0" y="500" width="1280" height="220" fill="url(#shadeBottom)"/>
  <rect x="0" y="0" width="230" height="720" fill="url(#shadeLeft)"/>
  <rect x="1050" y="0" width="230" height="720" fill="url(#shadeRight)"/>
</svg>
