<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="roBody" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#3A4758"/>
      <stop offset="100%" stop-color="#232D3F"/>
    </linearGradient>
    <linearGradient id="roScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7FD7E8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5AA9C4" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- radio receiver module -->
  <rect x="10" y="14" width="44" height="38" rx="7" fill="url(#roBody)" stroke="#5E7088" stroke-width="3"/>
  <!-- screen -->
  <rect x="16" y="20" width="32" height="14" rx="3.5" fill="#101823" stroke="#4E6076" stroke-width="2"/>
  <rect x="19" y="23" width="26" height="8" rx="2" fill="url(#roScreen)"/>
  <g stroke="#8FD4EC" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
    <path d="M22 28 L26 28 L28 25 L30 28 L35 28"/>
  </g>
  <!-- tune knobs -->
  <circle cx="24" cy="43" r="4" fill="#8A93A1" stroke="#5E7088" stroke-width="2"/>
  <circle cx="40" cy="43" r="4" fill="#8A93A1" stroke="#5E7088" stroke-width="2"/>
  <path d="M21.5 40.5 L26.5 45.5" stroke="#454F5F" stroke-width="1.4"/>
  <path d="M37.5 43 L42.5 43" stroke="#454F5F" stroke-width="1.4"/>

  <!-- dead cable -->
  <path d="M10 20 Q4 22 6 30" fill="none" stroke="#454F5F" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ============ dead-signal cross ============ -->
  <g stroke="#E25757" stroke-linecap="round">
    <line x1="40" y1="4" x2="56" y2="20" stroke-width="4"/>
    <line x1="56" y1="4" x2="40" y2="20" stroke-width="4"/>
  </g>
  <circle cx="48" cy="12" r="10.5" fill="none" stroke="#E25757" stroke-width="3"/>
  <!-- dull status lamp -->
  <circle cy="52" cx="32" r="3" fill="#4E5C6E"/>
</svg>
